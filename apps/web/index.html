<!doctype html>
<html lang="en-US" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a20">
  <title>VAULTBORN</title>
  <meta name="description" content="VaultBorn, a kingdom strategy game on Bitcoin Cash.">
  <link rel="canonical" href="__SITE__/">
  <!-- Link previews in chat apps and social sites. __SITE__ is filled in by the game server with the address it is reached at. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VaultBorn">
  <meta property="og:title" content="VaultBorn · A kingdom strategy game on Bitcoin Cash">
  <meta property="og:description" content="Build a city, command an army and raid your rivals. Free to play in your browser; every paid action is a Bitcoin Cash transaction that you approve in your own wallet.">
  <meta property="og:url" content="__SITE__/">
  <meta property="og:image" content="__SITE__/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="VaultBorn: build, defend, conquer. A kingdom strategy game on Bitcoin Cash.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VaultBorn · A kingdom strategy game on Bitcoin Cash">
  <meta name="twitter:description" content="Build a city, command an army and raid your rivals. Free to play; paid actions are Bitcoin Cash transactions you approve in your own wallet.">
  <meta name="twitter:image" content="__SITE__/og-image.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/battle-motion.css">
  <link rel="stylesheet" href="/game-feel.css">
  <link rel="stylesheet" href="/territory-outcomes.css">
  <link rel="stylesheet" href="/territory-field.css">
  <link rel="stylesheet" href="/political-assembly.css">
  <link rel="stylesheet" href="/strategy-stats.css">
  <link rel="stylesheet" href="/citadel.css">
  <link rel="stylesheet" href="/campaign-polish.css">
  <link rel="stylesheet" href="/first-campaign.css">
  <link rel="stylesheet" href="/game-guide.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="masthead" id="masthead"></header>
    <main class="theater" id="theater">
      <div class="world" id="world" role="region" tabindex="0" aria-label="Interactive world map. Use arrow keys to pan and plus or minus to zoom.">
        <div class="world-stage" id="world-stage">
          <div class="atlas-fringe" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <div class="terrain-image"></div>
          <canvas id="territories" aria-hidden="true"></canvas>
          <div class="world-cities" id="world-cities"></div>
        </div>
        <div class="world-shade"></div>
      </div>
      <div class="compass" aria-hidden="true"><i>N</i><span>✦</span></div>
      <aside class="left-dock" aria-label="My city and activity">
        <section class="frame city-dock" id="city-dock"></section>
        <section class="frame activity-dock" id="activity-dock"></section>
      </aside>
      <aside class="frame inspector" id="inspector" aria-label="Selected territory"></aside>
      <div class="atlas-controls" id="atlas-controls" aria-label="Map controls"></div>
      <nav id="region-navigation" class="region-navigation" aria-label="World regions" hidden></nav>
      <section class="campaign" id="campaign" hidden></section>
      <section class="campaign citadel citadel-embedded" id="campaign-citadel" hidden aria-label="Citadel archives">
        <nav class="citadel-bar" aria-label="Citadel navigation">
          <button type="button" class="btn" data-archive-back>Return to campaign</button>
          <a href="/ledger.html" data-citadel-link="ledger">Chain explorer</a>
          <a href="/council.html" data-citadel-link="council">Council &amp; sponsors</a>
        </nav>
        <div class="citadel-main" id="citadel-main"></div>
        <p class="citadel-toast" id="citadel-toast" role="status" hidden></p>
      </section>
      <div class="loading" id="loading"><div class="loading-mark"><img src="/logo.webp" width="63" height="80" alt=""></div><h1>VAULTBORN</h1><p>Opening the campaign map…</p></div>
    </main>
    <nav class="dock" id="dock" aria-label="Main navigation"></nav>
    <aside class="campaign-guide" id="campaign-guide" aria-labelledby="campaign-guide-title" hidden></aside>
  </div>
  <dialog class="dialog frame" id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="territory-outcome" id="territory-outcome" popover="manual" role="status"></div>
  <div class="political-outcome" id="political-outcome" popover="manual" aria-live="polite"></div>
</body>
</html>
